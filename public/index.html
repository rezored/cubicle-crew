<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubicle Crew</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --pod: 144px; --bubble-max: 180px; --label-max: 130px;
    --ui-bg: rgba(18, 14, 28, 0.86); --ui-border: #3a3452; --ui-text: #e8e2f8; --ui-dim: #9a92b8;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0c14; color: var(--ui-text); font: 13px/1.35 var(--font); }
  /* прозрачен фон (приложението): работният плот прозира около хората и мебелите */
  html.clear, html.clear body { background: transparent; }
  html.clear #stage, html.clear body.shopping #stage { left: auto; top: auto; right: 0; bottom: 0; } /* стаята е с постоянен размер – долу вдясно, над лентата */
  #stage { position: fixed; left: 0; top: 0; }
  #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
  /* табелата с името на офиса (месинг) над дъската */
  #overlay .sign { position: absolute; transform: translate(-50%, -62%); padding: 0 .7em; font-weight: 700; line-height: 1.45; color: #3a2810;
    background: linear-gradient(#f0d488, #c89a48); border: 1px solid #5a3c18; border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; }
  #overlay .sign[hidden] { display: none; }
  #overlay .sign.office-sign-text, .office-sign-text { display: flex; align-items: baseline; gap: .45em;
    background: #e6edf4; border: 1px solid #7d96ae; border-radius: 2px; font-weight: 700; line-height: 1.45; letter-spacing: normal; }
  .office-sign-text span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .office-sign-text .subtitle { font-size: .85em; font-weight: 600; padding-left: .45em; border-left: 1px solid #a7b8c9; }
  .office-sign-text[hidden] { display: none; }

  /* етикет под бюрото */
  .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; max-width: var(--label-max);
    padding: 1px 6px 2px; border-radius: 3px; background: rgba(14, 10, 22, 0.78); border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; line-height: 15px; white-space: nowrap; color: #ece6fa; will-change: transform; transition: opacity .3s; }
  .tag i { flex: none; width: 7px; height: 7px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .tag .n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tag .s { flex: none; color: var(--ui-dim); font-size: 11px; }
  .tag[data-state="waiting"] { background: #e04a6b; border-color: #ff9ab0; animation: pulse 0.64s steps(2) infinite; }
  .tag[data-state="waiting"] .s { color: #fff; font-weight: 600; }
  .tag.focus { outline: 2px solid #fff; }
  /* свит етикет (застъпваше по-важен) – само цветната точка; пълният – при посочване */
  .tag.mini { padding: 2px; gap: 0; }
  .tag.mini .n, .tag.mini .s { display: none; }

  /* балонче над главата */
  .bubble { position: absolute; left: 0; top: 0; max-width: var(--bubble-max); padding: 2px 7px 3px; border-radius: 3px;
    background: #f6f3ea; color: #1d1626; border: 2px solid #1d1626; box-shadow: 2px 2px 0 rgba(0,0,0,.35);
    font: 12px/15px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .25s; will-change: transform; }
  .bubble.show { opacity: 1; }
  .bubble b { font-weight: 700; margin-right: 5px; }
  /* рискова команда (danger() в util.js) */
  .bubble.danger { border-color: #b0182f; }
  .bubble.danger b::before { content: '⚠ '; color: #c41e3a; }
  .bubble.danger span { color: #c41e3a; font-weight: 700; }
  .danger { color: #ff6b7f; font-weight: 700; }
  #prompt code.danger { color: #ffd0d8; background: #5a1424; border: 1px solid #e04a6b; }
  #strip .row .what.danger { color: #ff6b7f; }
  .bubble[data-state="typing"] { border-left: 5px solid #4ac26b; }
  .bubble[data-state="reading"] { border-left: 5px solid #4a8fe0; }
  .bubble[data-state="running"] { border-left: 5px solid #e07a4a; }
  .bubble[data-state="delegating"] { border-left: 5px solid #b04ae0; }
  .bubble[data-state="waiting"] { background: #e04a6b; color: #fff; border-color: #2a0a14; font-family: var(--font); font-weight: 600; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }

  /* HUD */
  #hud { position: fixed; left: 8px; bottom: 8px; max-width: 48vw; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  #hud span { background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 2px 8px; box-shadow: 2px 2px 0 rgba(0,0,0,.3); }
  #hud b { color: #fff; }
  #hud .conn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #e0c24a; vertical-align: 0; }
  #hud .conn.connected i { background: #4ac26b; box-shadow: 0 0 6px #4ac26b; }
  #hud .conn.down i { background: #e04a6b; }
  #hud .conn.demo i { background: #b04ae0; }
  #hud .alert { background: #e04a6b; border-color: #ff9ab0; animation: pulse .64s steps(2) infinite; }
  /* токени: монетата е 5x5 пиксела, рисувана в tokens.js */
  #hud .tok { border-color: #7a5410; }
  #hud .tok i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; background-size: 100% 100%; image-rendering: pixelated; }
  #hud .tok b { color: #ffe27a; }
  #hud .tok.gain { background: #5a4214; border-color: #f0c840; }
  #hud .tok, #hud .shopbtn { pointer-events: auto; cursor: pointer; }
  #hud .shopbtn { border-color: #6a3a8a; color: #f0e0ff; }
  #hud .shopbtn:hover, #hud .tok:hover { filter: brightness(1.25); }
  #hud .shopbtn i { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }

  /* легендата: колона в долния десен ъгъл, по едно състояние на ред */
  #legend { position: fixed; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
    background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 4px 9px; font-size: 12px; pointer-events: none; white-space: nowrap; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; display: inline-block; border-radius: 1px; }
  #legend em { color: var(--ui-dim); font-style: normal; font-size: 11px; margin-top: 2px; }

  #tooltip, #card { position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; min-width: 180px; max-width: 320px;
    background: var(--ui-bg); border: 1px solid #5a5278; border-radius: 4px; padding: 6px 9px; box-shadow: 3px 3px 0 rgba(0,0,0,.35); font-size: 12px; }
  #card { left: auto; right: 8px; top: 8px; border-color: #fff; }
  #tooltip table, #card table { border-collapse: collapse; }
  #tooltip th, #card th { text-align: left; font-weight: 400; color: var(--ui-dim); padding: 1px 10px 1px 0; vertical-align: top; white-space: nowrap; }
  #tooltip td, #card td { padding: 1px 0; overflow-wrap: anywhere; }
  .title { font-weight: 600; margin-bottom: 4px; }
  .dim { color: var(--ui-dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 5px; }

  #empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--ui-bg); border: 1px solid var(--ui-border);
    padding: 8px 14px; border-radius: 4px; font-size: 14px; pointer-events: none; box-shadow: 3px 3px 0 rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; max-width: min(420px, calc(100vw - 32px)); }
  #empty[hidden] { display: none; }
  #empty span { color: var(--ui-dim); font-size: 12px; line-height: 1.35; }
  #empty a { pointer-events: auto; color: #e0c24a; font-size: 12px; }
  body.desktop #empty span { font-size: 11px; }
  #debug { position: fixed; right: 8px; bottom: 44px; max-width: 560px; background: rgba(0,0,0,.8); color: #9fe0a0; font: 11px/1.3 var(--mono);
    padding: 6px 8px; border-radius: 3px; pointer-events: none; z-index: 6; }
  #debug pre { margin: 4px 0 0; white-space: pre; overflow: hidden; }
  #atlas { position: fixed; inset: 0; overflow: auto; background: #2a2838; z-index: 10; display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #atlas canvas { image-rendering: pixelated; background: #3a3850; }
  /* desktop (Electron): лента за местене на прозореца, видима при посочване */
  #winbar { display: none; }
  body.desktop #winbar { display: flex; position: fixed; left: 0; right: 0; top: 0; height: 24px; z-index: 20; align-items: center; gap: 2px;
    padding: 0 4px 0 10px; background: rgba(14, 10, 22, 0.88); border-bottom: 1px solid var(--ui-border); -webkit-app-region: drag; user-select: none;
    opacity: 0; transition: opacity .2s; font-size: 12px; color: var(--ui-dim); }
  body.desktop:hover #winbar { opacity: 1; }
  body.desktop.mouse-out #winbar { opacity: 0; } /* прозрачен фон: мишката излезе през празното – :hover остава, затова клас */
  #winbar .grip { flex: 1; }
  #winbar button { -webkit-app-region: no-drag; width: 26px; height: 20px; border: 0; border-radius: 3px; background: transparent; color: var(--ui-text);
    font: 13px/20px var(--font); cursor: pointer; padding: 0; }
  #winbar button:hover { background: rgba(255,255,255,.12); }
  #winbar button.on { color: #e0c24a; }
  #winbar button[data-act="quit"]:hover { background: #e04a6b; }
  body.desktop #hud { left: 4px; bottom: 4px; gap: 3px; font-size: 11px; }
  body.desktop:has(#legend[hidden]) #hud { max-width: calc(100vw - 8px); } /* скрита легенда (по подразбиране в малкия прозорец) – целият ред е за HUD-а */
  body.desktop #hud span { padding: 1px 5px; }
  body.desktop #legend { right: 4px; bottom: 4px; font-size: 11px; }
  body.desktop #card { top: 30px; }
  /* в малкия прозорец HUD-ът се показва при посочване; червеното "чакат те" и токените остават винаги */
  /* сутрешен екран (?wait): сцената е отделен канвас над офиса, текстът е DOM лента долу */
  #morning { position: fixed; left: 0; top: 0; z-index: 15; image-rendering: pixelated; cursor: pointer; transition: opacity .6s; }
  #wait { position: fixed; left: 0; right: 0; bottom: 6px; margin: 0 auto; width: fit-content; z-index: 16; max-width: calc(100vw - 16px); box-sizing: border-box;
    background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 3px; padding: 2px 9px 3px; box-shadow: 2px 2px 0 rgba(0,0,0,.3);
    font-size: 12px; line-height: 15px; text-align: center; cursor: pointer; transition: opacity .6s; }
  #wait b { display: block; color: #ffe27a; }
  #wait b i { font-style: normal; font-weight: normal; color: #9ad0ff; margin-left: 4px; }
  /* с много намерени агенти текстът минава на два реда (прозорецът е 300 px) */
  #wait span { display: block; color: var(--ui-text); }
  #morning.gone, #wait.gone { opacity: 0; pointer-events: none; }
  body.waiting #hud, body.waiting #legend, body.waiting #empty, body.waiting #card, body.waiting #tooltip { visibility: hidden; }
  body.desktop #hud span { transition: opacity .2s; }
  body.desktop:not(:hover) #hud span:not(.alert):not(.tok):not(.shopbtn):not(.mute),
  body.desktop.mouse-out #hud span:not(.alert):not(.tok):not(.shopbtn):not(.mute) { opacity: 0; }
  body.desktop #empty { font-size: 12px; padding: 5px 10px; }
  body.tiny .tag { font-size: 10px; line-height: 12px; padding: 0 4px 1px; gap: 3px; }
  body.tiny .tag i { width: 6px; height: 6px; }
  body.tiny .tag .s { display: none; }
  body.tiny .bubble { font-size: 10px; line-height: 12px; padding: 1px 4px 2px; border-width: 1px; }
  body.tiny .bubble.show:not([data-state="waiting"]):not(.hl) { opacity: 0; }
  #hud .tok { pointer-events: auto; cursor: pointer; }
  #hud .tok:hover { border-color: #f0c840; }
  #hud .lang { pointer-events: auto; cursor: pointer; color: var(--ui-dim); }
  #hud .lang:hover { color: #fff; border-color: #6b6b80; }
  /* звънче: звук вкл./изкл. */
  #hud .snd { pointer-events: auto; cursor: pointer; }
  #hud .mute { pointer-events: auto; cursor: pointer; }
  #hud .mute:hover { filter: brightness(1.25); border-color: #6b6b80; }
  #hud .mute.on { border-color: #e04a6b; }
  #hud .mute i { display: inline-block; width: 11px; height: 11px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }
  #hud .snd:hover { filter: brightness(1.25); border-color: #6b6b80; }
  #hud .snd i { display: inline-block; width: 11px; height: 11px; vertical-align: -2px; background-size: 100% 100%; image-rendering: pixelated; }

  /* магазин */
  /* висок панел отляво: офисът се мести вдясно от него (main.js), за да се вижда целият прегледът на посочения предмет;
     в тесен прозорец – лента отдолу, офисът е над нея */
  :root { --shop-w: clamp(340px, 36vw, 480px); }
  #shop { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; width: var(--shop-w); }
  body.desktop #shop { top: 24px; }
  body.shopping #stage { left: var(--shop-w); }
  .shop-panel { width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
    background: #17121f; border-right: 2px solid #3a3452; box-shadow: 4px 0 0 rgba(0,0,0,.35); }
  /* малък прозорец (и приложението – то вече не расте): по-тесен панел, офисът до него е в мащаб 1 */
  @media (max-width: 899px), (max-height: 539px) { :root { --shop-w: clamp(220px, 46vw, 340px); } }
  @media (max-width: 479px) {
    #shop, body.desktop #shop { top: auto; right: 0; width: auto; height: clamp(160px, 62vh, 460px); }
    .shop-panel { border-right: 0; border-top: 2px solid #3a3452; box-shadow: 0 -4px 0 rgba(0,0,0,.35); }
    body.shopping #stage { left: 0; }
  }
  body.shopping #hud, body.shopping #legend, body.shopping #card, body.shopping #empty { visibility: hidden; }
  .shop-panel header, .shop-panel nav { padding-top: 4px; padding-bottom: 4px; }
  .shop-panel header { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #2c2640; }
  .shop-panel .ttl { font-size: 15px; }
  .shop-panel .bal { margin-left: auto; padding: 2px 8px; border: 1px solid #7a5410; border-radius: 3px; color: #ffe27a; font-weight: 600; }
  .shop-panel i[style] { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; background-size: 100% 100%; image-rendering: pixelated; }
  .shop-panel button { font: inherit; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .shop-panel button:hover:not(:disabled) { background: #3a3258; }
  .shop-panel button:disabled { opacity: .5; cursor: default; }
  .shop-panel .x { padding: 2px 7px; }
  .shop-panel nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; border-bottom: 1px solid #2c2640; }
  .shop-panel nav button.on { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  .shop-panel .body { flex: 1; overflow-y: auto; padding: 4px 10px 10px; }
  .shop-panel h3 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: var(--ui-dim); text-transform: uppercase; letter-spacing: .04em; }
  .shop-panel .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .shop-panel .card .by { font-size: 11px; color: #c8a0ff; }
  .shop-panel h4 { margin: 10px 0 6px; font-size: 11px; font-weight: 600; color: #c8a0ff; }
  .shop-panel .card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; background: #1f1a2c; border: 1px solid #2c2640; border-radius: 3px; text-align: center; }
  .shop-panel .card:hover { border-color: #6b6b80; }
  .shop-panel .card.on { border-color: #4ac26b; box-shadow: inset 0 0 0 1px #4ac26b; }
  .shop-panel .th { image-rendering: pixelated; margin: 2px 0; }
  .shop-panel .avatar { display: flex; flex-wrap: wrap; gap: 16px; padding-top: 8px; }
  .shop-panel .avatar .pv { display: flex; gap: 8px; align-items: flex-start; }
  .shop-panel .avatar .pv canvas { border: 1px solid #2c2640; border-radius: 3px; }
  .shop-panel .avatar .opts { flex: 1; min-width: 220px; }
  .shop-panel .avatar .opts h3:first-child { margin-top: 0; }
  .shop-panel .avatar .sw { display: flex; flex-wrap: wrap; gap: 6px; }
  .shop-panel .avatar .sw button.on { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  .shop-panel .avatar .sw button.dot { width: 24px; height: 24px; padding: 0; border: 2px solid #1d1626; box-shadow: 0 0 0 1px #3a3452; }
  .shop-panel .avatar .sw button.dot.on { border-color: #1d1626; box-shadow: 0 0 0 2px #e0c24a; }
  .shop-panel section > .hint { margin: 6px 0 0; font-size: 12px; color: var(--ui-dim); }
  .shop-panel section > .act { justify-content: flex-start; margin-top: 6px; }
  .shop-panel .avatar .hint { margin: 12px 0 0; font-size: 12px; color: var(--ui-dim); }
  .shop-panel .avatar .sw.desk button { padding: 2px 4px; min-height: 36px; }
  .shop-panel .avatar .sw.desk canvas { display: block; }
  .shop-panel .avatar .reset { margin-top: 12px; }
  .shop-panel .crew > button[data-me] { margin: 2px 0 0; }
  .shop-panel .crew > button.meon { background: #e0c24a; color: #1d1626; border-color: #e0c24a; }
  /* „Моят офис“: табела + твои картини */
  .shop-panel .mine .pics { display: flex; flex-wrap: wrap; gap: 8px; }
  .shop-panel .office-sign-form { display: grid; gap: 7px; max-width: 420px; }
  .shop-panel .office-sign-form label { display: grid; grid-template-columns: minmax(0,1fr) minmax(70px,1.5fr); align-items: center; gap: 6px; }
  .shop-panel .office-sign-form input { min-width: 0; justify-self: start; }
  .shop-panel .office-sign-form input[type="text"] { box-sizing: border-box; width: 100%; font: inherit; color: var(--ui-text);
    background: #0f0c16; border: 1px solid #3a3452; border-radius: 3px; padding: 3px 6px; }
  .shop-panel .office-sign-form .office-sign-text { justify-self: start; max-width: 100%; padding: 0 .7em; }
  .shop-panel .office-sign-form button { justify-self: start; }
  .shop-panel .mine .pic { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; background: #1f1a2c; border: 1px solid #2c2640; border-radius: 3px; width: 120px; text-align: center; }
  .shop-panel .mine .pic canvas { width: 48px; height: 60px; }
  .shop-panel .mine .pic .nm { font-size: 11px; color: var(--ui-dim); }
  .shop-panel .mine .pic .act { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  /* „Екип“: постоянните колеги */
  .shop-panel .crew { padding-top: 6px; }
  .shop-panel .crew .intro { margin: 0 0 6px; font-size: 12px; color: var(--ui-dim); max-width: 560px; }
  .shop-panel .crew .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .shop-panel .crew .person { display: flex; gap: 8px; align-items: center; text-align: left; padding: 4px 8px 4px 4px; background: #1f1a2c; border-color: #2c2640; min-width: 0; }
  .shop-panel .crew .person:hover { border-color: #6b6b80; }
  .shop-panel .crew .person.here { border-color: #3c6a4a; }
  .shop-panel .crew .person canvas { flex: none; border-radius: 2px; }
  .shop-panel .crew .tx { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .shop-panel .crew .tx > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shop-panel .crew .dim { font-size: 11px; color: var(--ui-dim); }
  .shop-panel .crew .tx .in { font-size: 10px; color: #4ac26b; }
  .shop-panel .crew .crewtop { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; }
  .shop-panel .crew .crewtop b { font-size: 14px; }
  .shop-panel .weather { padding-top: 8px; max-width: 560px; }
  .shop-panel .weather h3:first-child { margin-top: 0; }
  .shop-panel .weather .cur { margin: 0 0 10px; }
  .shop-panel .weather .find { display: flex; gap: 6px; margin-bottom: 8px; }
  .shop-panel .wxdemo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .set-panel section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .set-panel header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 9px 16px;
    border-bottom: 2px solid var(--line); background-image: repeating-linear-gradient(90deg, var(--acc) 0 6px, transparent 6px 10px); background-size: 100% 2px; background-repeat: no-repeat; background-position: bottom; }
  .set-panel h2 { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 16px; color: #fff; }
  .set-panel .x { font: inherit; width: 26px; height: 24px; color: var(--ui-text); background: #2a2440; border: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.35); cursor: pointer; }
  .set-panel .x:hover { background: #e04a6b; color: #fff; }
  .set-panel .body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .set-panel h4 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; color: var(--acc); text-transform: uppercase; letter-spacing: .06em; }
  .set-panel .body > h4:first-child { margin-top: 6px; } /* „Размер и място“ е най-горе в „Прозорец“ */
  .set-panel p { margin: 8px 0 0; font-size: 12px; }
  .set-panel .dim { color: var(--ui-dim); }
  .set-panel .err { color: #ff8a9e; margin: 0 0 6px; }
  .set-panel a { color: #8fc0ff; }
  /* ред с превключвател */
  .set-panel .opt { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 9px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .set-panel .opt:hover { background: rgba(255,255,255,.025); }
  .set-panel input.range { flex: none; width: 120px; margin: 2px 0 0; accent-color: var(--acc); cursor: pointer; }
  .set-panel .opt output { font: 12px var(--mono); color: var(--acc); margin-left: 4px; }
  .set-panel .opt b { color: #fff; font-weight: 600; }
  .set-panel .opt small, .set-panel .card small { display: block; margin-top: 2px; color: var(--ui-dim); font-size: 12px; line-height: 1.4; }
  .set-panel input.sw { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 32px; height: 18px; margin: 1px 0 0; background: #2a2440;
    border: 2px solid #0e0c14; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); cursor: pointer; }
  .set-panel input.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: #8a8aa0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); transition: left .12s steps(3); }
  .set-panel input.sw:checked { background: var(--acc); }
  .set-panel input.sw:checked::after { left: 16px; background: #fff; }
  .set-panel input.sw:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  /* карти за избор (Офис / Фокус, език) */
  .set-panel .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 4px; }
  .set-panel .card { position: relative; display: block; padding: 9px 11px; background: #1f1a2c; border: 2px solid var(--line); cursor: pointer; }
  .set-panel .card input { position: absolute; opacity: 0; pointer-events: none; }
  .set-panel .card b { color: #fff; }
  .set-panel .card:has(input:checked) { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, #1f1a2c); }
  .set-panel .card:has(input:focus-visible) { outline: 2px solid #fff; }
  .set-panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 4px; }
  .set-panel .row > b { color: #fff; font-weight: 600; }
  .set-panel .seg { display: flex; }
  .set-panel .seg .card { padding: 4px 12px; border-width: 2px; }
  .set-panel .seg .card + .card { margin-left: -2px; }
  /* бутони и линкове */
  .set-panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .set-panel .btns button, .set-panel .btns a { font: inherit; font-size: 12px; color: var(--ui-text); background: #2a2440; border: 0; padding: 5px 10px; text-decoration: none;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); cursor: pointer; }
  .set-panel .btns button:hover, .set-panel .btns a:hover { background: color-mix(in srgb, var(--acc) 35%, #2a2440); color: #fff; }
  .set-panel .btns.big button { font-size: 13px; padding: 8px 14px; }
  .set-panel ul.folders { list-style: none; margin: 4px 0 0; padding: 0; }
  .set-panel ul.folders li { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; min-width: 0; }
  .set-panel ul.folders code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; user-select: all; }
  .set-panel button.mini { font: inherit; font-size: 11px; color: var(--ui-text); background: #2a2440; border: 0; padding: 1px 6px; cursor: pointer; flex: none; }
  .set-panel button.mini:hover { background: #e04a6b; color: #fff; }
  .set-panel .folderadd input { flex: 1 1 180px; min-width: 0; font: inherit; font-size: 12px; color: var(--ui-text); background: #17131f; border: 1px solid var(--ui-border); padding: 4px 6px; }
  /* помощ */
  .set-panel ul.states { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .set-panel ul.states li { display: flex; gap: 8px; align-items: baseline; }
  .set-panel ul.states li i { flex: none; width: 9px; height: 9px; display: inline-block; }
  .set-panel table.keys { border-collapse: collapse; font-size: 12px; }
  .set-panel table.keys th { text-align: left; padding: 2px 12px 2px 0; font-weight: 400; white-space: nowrap; }
  .set-panel kbd { font: 11px var(--mono); color: #fff; background: #2a2440; padding: 1px 5px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.4); }
  /* малък прозорец (и приложението – то вече не расте): панелът заема прозореца, по-дребен текст, съдържанието е със скрол */
  @media (max-width: 899px), (max-height: 539px) {
    #help { padding: 4px; }
    .set-panel { max-width: none; max-height: none; font-size: 12px; }
    .set-panel aside { width: 136px; }
    .set-panel .brand { padding: 8px 10px 6px; font-size: 12px; }
    .set-panel nav { padding: 4px; }
    .set-panel nav button { gap: 7px; padding: 4px 6px; }
    .set-panel .ico { width: 14px; height: 14px; }
    .set-panel aside .v { padding: 4px 10px 6px; font-size: 10px; }
    .set-panel header { padding: 5px 6px 5px 10px; }
    .set-panel h2 { gap: 7px; font-size: 14px; }
    .set-panel .x { width: 22px; height: 20px; }
    .set-panel .body { padding: 2px 10px 10px; }
    .set-panel h4 { margin: 10px 0 4px; }
    .set-panel p, .set-panel table.keys { font-size: 11px; }
    .set-panel .opt { gap: 10px; padding: 6px 2px; }
    .set-panel .opt small, .set-panel .card small { font-size: 11px; line-height: 1.35; }
    .set-panel .cards { gap: 6px; margin: 4px 0 2px; }
    .set-panel .card { padding: 6px 8px; }
    .set-panel .row { padding: 6px 2px; }
    .set-panel .btns.big button { font-size: 12px; padding: 6px 10px; }
  }
  /* тесен прозорец: разделите стават ред с иконки горе */
  @media (max-width: 560px) {
    .set-panel { flex-direction: column; max-height: none; }
    .set-panel aside { width: auto; flex-direction: row; align-items: center; border-right: 0; border-bottom: 2px solid #0e0c14; }
    .set-panel .brand, .set-panel aside .v { display: none; }
    .set-panel nav { flex-direction: row; padding: 4px; overflow-x: auto; }
    .set-panel nav button { width: auto; border-left: 0; border-bottom: 3px solid transparent; padding: 6px 8px; }
    .set-panel nav button.on { border-bottom-color: var(--acc); }
    .set-panel nav button span { display: none; }
    .set-panel .cards { grid-template-columns: 1fr; }
  }

  /* картата при фокус: бутон „Преименувай“ */
  #card { pointer-events: auto; }
  #card .ren { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  #card .hist { margin-top: 6px; padding-top: 5px; border-top: 1px solid #3a3452; max-height: 150px; overflow-y: auto; font-size: 11px; }
  #card .hist > b { display: block; color: var(--ui-dim); font-weight: 600; margin-bottom: 2px; }
  #card .hist div { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
  #card .hist .t { color: var(--ui-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #card .hist .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
  #card .ren button { font: inherit; font-size: 11px; color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; border-radius: 3px; padding: 1px 8px; cursor: pointer; }
  #card .ren input { width: 100%; box-sizing: border-box; font: inherit; color: var(--ui-text); background: #0f0c16; border: 1px solid #3a3452; border-radius: 3px; padding: 2px 6px; }

  #note { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 36; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 5px 12px;
    background: var(--ui-bg); border: 1px solid #5a5278; border-radius: 3px; box-shadow: 2px 2px 0 rgba(0,0,0,.35); font-size: 12px; pointer-events: none; }
  body.strip #note { bottom: 4px; }
  /* демото в интернет (?web / GitHub Pages): какво е това + откъде се взима приложението */
  #webbar { position: fixed; left: 12px; right: 12px; top: 8px; width: fit-content; margin: 0 auto; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 10px; box-sizing: border-box; padding: 6px 10px 6px 14px; background: var(--ui-bg); border: 1px solid #5a5278;
    border-radius: 3px; box-shadow: 2px 2px 0 rgba(0,0,0,.35); font-size: 12px; }
  #webbar a { color: #1d1626; background: #e0c24a; border-radius: 3px; padding: 2px 10px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  #webbar a.star { color: var(--ui-text); background: #2a2440; border: 1px solid #3a3452; font-weight: 400; }
  #webbar a:hover { filter: brightness(1.12); }
  #webbar .or { color: var(--ui-dim); }
  #webbar code { font: 12px var(--mono); color: #ffe27a; user-select: all; white-space: nowrap; }
  #webbar .x { font: inherit; color: var(--ui-dim); background: none; border: 0; cursor: pointer; padding: 0 2px; }
  #webbar.small { left: auto; right: 8px; padding: 4px; }
  body.web #toast { top: 52px; }
  body.portrait #webbar:not(.small) { top: auto; bottom: 84px; padding: 10px 12px; } /* изправен телефон: в празното място под списъка */
  body.portrait #webbar .txt { display: block; width: 100%; text-align: center; }
  #webbar.small > :not(.get) { display: none; }
  body.shopping #webbar, body.setting-up #webbar { display: none; }
  @media (max-width: 759px) { #webbar .or, #webbar code { display: none; } }
  @media (max-width: 479px) { #webbar .txt { display: none; } }
  #strip .row { cursor: pointer; }
  /* тънка лента (?strip): по един ред на сесия вместо офиса */
  body.strip #stage, body.strip #hud, body.strip #legend, body.strip #empty, body.strip #tooltip, body.strip #card, body.strip #toast { display: none !important; }
  body.strip #winbar { display: none; }
  #strip { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 6px 4px; box-sizing: border-box; background: #14101c; border-top: 3px solid #2c2640; -webkit-app-region: drag; user-select: none; }
  #strip .row { display: grid; grid-template-columns: 9px minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 7px; align-items: center; padding: 3px 6px; border-radius: 3px; background: #1f1a2c; font-size: 12px; line-height: 16px; -webkit-app-region: no-drag; }
  #strip .row i { width: 9px; height: 9px; }
  #strip .row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #strip .row .what { color: var(--ui-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
  #strip .row .time { color: var(--ui-dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #strip .row.wait { background: #e04a6b; animation: pulse .64s steps(2) infinite; }
  #strip .row.wait .what, #strip .row.wait .time { color: #fff; }
  #strip .row.wait i { background: #fff !important; }
  #strip .none { padding: 4px 6px; font-size: 12px; color: var(--ui-dim); -webkit-app-region: no-drag; }
  #strip .row[data-state="idle"] i { border-radius: 50%; }
  #strip .row[data-state="thinking"] i { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  #strip .row[data-state="reading"] i { clip-path: inset(22% 0); }
  #strip .row[data-state="running"] i { clip-path: polygon(8% 0, 100% 50%, 8% 100%); }
  #strip .row[data-state="delegating"] i { clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }
  #strip .row[data-state="waiting"] i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  /* ?overlay (OBS/стрийм): само сцената */
  body.overlay #hud, body.overlay #legend, body.overlay #winbar, body.overlay #empty, body.overlay #card, body.overlay #tooltip { display: none !important; }
  [hidden] { display: none !important; }
  /* Разреши / Откажи – молба за разрешение от Claude Code (hook) */
  #prompt { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px); padding: 7px 10px; background: rgba(20,14,28,.96); border: 1px solid #e04a6b; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.5); font: 13px/1.3 var(--font); color: var(--ui-text); }
  #prompt .q b { color: #fff; }
  #prompt code { font: 12px var(--mono); color: #d8d0ee; background: #2a2236; padding: 2px 6px; border-radius: 3px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #prompt button { font: inherit; color: #fff; background: #3a3248; border: 1px solid #5a5068; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #prompt button.ok { background: #2e7a48; border-color: #4ac26b; }
  #prompt button:hover { filter: brightness(1.15); }
  #prompt kbd { font: 11px var(--mono); opacity: .7; margin-left: 4px; }
  #prompt .more { color: var(--ui-dim); font-size: 12px; }
  body.overlay #prompt { display: none; }
  /* изгледът за телефон: само за гледане */
  body.lan #prompt, body.lan #hud .shopbtn, body.lan #hud .help, body.lan #hud .statsbtn, body.lan #hud .snd { display: none; }
  body.lan #hud .tok { pointer-events: none; }
  /* изправен телефон (изгледът за телефон и демото в интернет): списък на сесиите под офиса, без легенда (редовете казват състоянието с думи) */
  #strip.list { display: none; }
  body.portrait #strip.list { display: flex; top: calc(var(--office-h, 0px) + 6px); bottom: auto; gap: 4px; padding: 0 8px; background: none; border-top: 0;
    -webkit-app-region: no-drag; }
  body.portrait #strip.list .row { cursor: default; padding: 7px 10px; font-size: 14px; line-height: 18px; grid-template-columns: 11px minmax(0, 1fr) auto; }
  body.portrait #strip.list .row i { width: 11px; height: 11px; }
  body.portrait #strip.list .row .what { grid-column: 2 / 4; grid-row: 2; font-size: 12px; }
  body.portrait #strip.list .row .time { grid-column: 3; grid-row: 1; }
  body.portrait #strip.list .none { font-size: 13px; }
  body.portrait #legend { display: none; }
  body.portrait #hud { max-width: calc(100vw - 16px); }
  body.lan #legend em { display: none; } /* „L – легенда · Esc“ – на телефона няма клавиатура */
  #lanlogin { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 24px; background: #0e0c14; text-align: center; }
  #lanlogin b { font-size: 18px; color: #ffe27a; }
  #lanlogin span { color: var(--ui-dim); max-width: 320px; }
  #lanlogin input { width: 9ch; font: 600 26px/1.2 var(--mono); letter-spacing: .2em; text-align: center; color: var(--ui-text);
    background: #17121f; border: 2px solid var(--ui-border); border-radius: 4px; padding: 6px 8px; }
  #lanlogin button { font: inherit; font-size: 15px; padding: 6px 22px; color: #1d1626; background: #e0c24a; border: 0; border-radius: 3px; cursor: pointer; }
  #lanlogin .err { color: #ff9ab0; margin: 0; }
  .lanbox { margin: 4px 0 10px; padding: 8px 10px; border: 1px solid var(--ui-border); border-radius: 3px; }
  .lanbox p { margin: 0 0 6px; }
  .lanbox code { user-select: all; }
  .lanbox .qr { float: right; width: 132px; height: 132px; margin: 0 0 6px 10px; image-rendering: pixelated; border-radius: 3px; }
  .lanbox::after { content: ''; display: block; clear: both; }
  .lanbox .pin { font: 600 18px var(--mono); letter-spacing: .15em; color: #ffe27a; }
  #hud .help.upd { position: relative; }
  #hud .help.upd::after { content: ''; position: absolute; top: 1px; right: 1px; width: 5px; height: 5px; background: #4ac26b; border-radius: 50%; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="420" height="250"></canvas>
  <div id="overlay"></div>
</div>
<div id="hud"></div>
<div id="legend"></div>
<div id="tooltip" hidden></div>
<div id="card" hidden></div>
<div id="empty" hidden></div>
<div id="debug" hidden></div>
<div id="shop" hidden></div>
<div id="toast" hidden></div>
<div id="winbar"><span class="grip">Cubicle Crew</span><button data-act="pin" title="Винаги отгоре">▲</button><button data-act="clear" title="Прозрачен фон">◐</button><button data-act="reset-size" title="Нулирай размера">⤡</button><button data-act="settings" title="Настройки (размер, известия, демо…)">⚙</button><button data-act="hide" title="Скрий в трея">–</button><button data-act="quit" title="Затвори">✕</button></div>
<script type="module" src="main.js"></script>
</body>
</html>
